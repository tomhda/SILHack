<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SILHack-dev Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="shell">
    <header class="page-header">
      <div>
        <h1>SILHack-dev</h1>
        <p>AIチャットとChatworkの入力補助を調整します。</p>
      </div>
      <div class="page-actions">
        <button id="reset" type="button" class="secondary">初期値に戻す</button>
      </div>
    </header>

    <section id="updateNotice" class="update-notice" hidden>
      <div>
        <p id="updateNoticeLabel" class="notice-label">お知らせ</p>
        <h2 id="updateNoticeTitle">SILHack-dev</h2>
        <p id="updateNoticeVersion" class="notice-version"></p>
        <ul id="updateNoticeList"></ul>
      </div>
      <button id="dismissUpdateNotice" type="button">OK</button>
    </section>

    <section class="section">
      <h2>キーの割り当て</h2>
      <table class="key-table" id="keyTable"></table>
    </section>

    <section class="section" id="geminiSection">
      <h2>Gemini</h2>
      <div class="field-list">
        <label class="field">
          <span>モデル</span>
          <select id="geminiModel">
            <option value="keep">変更しない</option>
            <option value="auto">自動モード</option>
            <option value="hydrogen">Hydrogen</option>
            <option value="neon">Neon</option>
            <option value="carbon">Carbon</option>
          </select>
        </label>
        <label class="field" id="geminiThinkingField">
          <span>思考レベル</span>
          <select id="geminiThinkingLevel">
            <option value="keep">変更しない</option>
            <option value="low">低</option>
            <option value="medium">標準</option>
            <option value="high">高</option>
          </select>
        </label>
      </div>
    </section>

    <section class="section" id="messengerSection">
      <h2>Messenger</h2>
      <label class="field">
        <span>IME確定ガード</span>
        <input id="messengerCompositionGuardMs" type="number" min="0" max="1000" step="10">
        <small>ミリ秒。0で無効。</small>
      </label>
    </section>

    <section class="section">
      <h2>Chatwork</h2>
      <div class="field-list">
        <label class="toggle-row">
          <input id="chatworkSidebarScrollLock" type="checkbox">
          <span>ルーム一覧の端でスクロールを止める</span>
        </label>
        <label class="toggle-row">
          <input id="chatworkMarkdownAutoPaste" type="checkbox">
          <span>Markdown貼り付けを自動でChatworkタグに変換</span>
        </label>
      </div>
    </section>

    <p id="status" class="status" role="status" aria-live="polite"></p>
  </main>

  <script src="../js/settings.js"></script>
  <script src="../js/update_notice.js"></script>
  <script src="options.js"></script>
</body>
</html>
